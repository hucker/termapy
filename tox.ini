[tox]
envlist = py311, py312, py313, py314, py315
skip_missing_interpreters = true
requires = tox-uv

[testenv]
runner = uv-venv-lock-runner
# Every extra, as CI installs them (--all-extras): the ~180 tests guarded by
# pytest.importorskip("mcp") run here too, and the ty hygiene test resolves
# every optional import (textual_serve is the web extra's).
extras =
    all
# --no-cov: a version run checks that the suite passes; coverage is measured
# once, in CI, for Codecov, and tracing slows every run.  Two passes: the
# timing tests depend on wall-clock time, so they run alone after the
# parallel pass (registry timing-tests-run-alone).
commands =
    pytest --no-cov -m "not timing" {posargs}
    pytest --no-cov -m timing -n 0 {posargs}
