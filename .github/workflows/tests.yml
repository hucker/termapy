name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # A flaky Pilot test on one version must not cancel the others.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Run tests
        # CRC code-gen execution tests (which needed gcc/rustc/ghdl on
        # PATH) moved out to the standalone crcglot package in 2026-05;
        # they run in crcglot's own CI now.  Termapy keeps a tiny
        # wrapper smoke test that doesn't need any toolchain.
        #
        # --all-extras: the MCP SDK so the ~180 tests guarded by
        # pytest.importorskip("mcp") actually run (without it they are
        # silently uncollected and mcp/server.py has zero CI coverage), and
        # every other extra because tests/test_hygiene.py runs `ty check`,
        # whose count depends on what is installed: a missing extra reads
        # as an unresolved import.  The gate names the all-extras
        # environment (CLAUDE.md Precommit), so CI checks in it too.
        run: uv run --python ${{ matrix.python-version }} --all-extras pytest

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Run tests with coverage
        # --all-extras so the MCP tests run and mcp/* is counted in coverage
        # (previously 0% in CI because those tests were uncollected), and so
        # the ty gate in tests/test_hygiene.py sees every optional import.
        run: uv run --python 3.14 --all-extras pytest --cov=termapy --cov-report=xml:coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: hucker/termapy

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Audit uv.lock
        # The same gate release_prep runs: pip-audit over the exported
        # lock, every extra and group, nothing installed.  The previous
        # form (uv sync without extras, then --path .) audited zero
        # packages and stayed green; see scripts/audit_lock.py.
        run: python3 scripts/audit_lock.py
