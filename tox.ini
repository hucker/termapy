[tox]
envlist = py311, py312, py313, py314
skip_missing_interpreters = true
requires = tox-uv

[testenv]
runner = uv-venv-lock-runner
# Install the mcp extra so the ~180 tests guarded by
# pytest.importorskip("mcp") run here too (silently uncollected otherwise).
# Mirrors CI's --extra mcp; the `web` extra gates no tests.
extras =
    mcp
commands =
    pytest {posargs}
