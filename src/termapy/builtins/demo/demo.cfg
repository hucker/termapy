{
    "config_version": 36,
    "title": "Demo Device",
    "border_color": "",
    "serial": {
        "port": "DEMO",
        "baud_rate": 115200,
        "custom_baud": false,
        "byte_size": 8,
        "parity": "N",
        "stop_bits": 1,
        "flow_control": "none"
    },
    "auto_connect": true,
    "auto_reconnect": false,
    "on_connect_cmd": "",
    "tui_on_connect_cmd": "/run welcome",
    "cli_on_connect_cmd": "/run welcome",
    "mcp_on_connect_cmd": "",
    "encoding": "utf-8",
    "eol": "\r",
    "tx_char_delay_ms": 0,
    "tx_line_delay_ms": 0,
    "eol_rx": "auto",
    "eol_markers": false,
    "send_bare_enter": false,
    "cmd_delay_ms": 0,
    "multiline_paste": true,
    "multiline_paste_delay_ms": 10,
    "control_keys": true,
    "echo": true,
    "echo_fmt": "[purple]$(CFG)> {cmd}[/]",
    "timestamps": false,
    "line_no": false,
    "hex": false,
    "color": true,
    "output_level": "normal",
    "max_lines": 10000,
    "max_grep_lines": 100,
    "protocol": "text",
    "ndjson_field_routing": {"response_id": "id", "error_field": "error", "event_field": "event"},
    "request_mode": false,
    "request_err_pattern": "(?i)^(ERROR|ERR|FAULT)\\b",
    "strip_device_echo": false,
    "json_style": "compact",
    "profile_path": "",
    "validate_typed_args": false,
    "default_response_timeout_ms": 1000,
    "log_file": "",
    "file_xfer_root": "",
    "proto_frame_gap_ms": 50,
    "proto_results_template": "{name}_results.json",
    "default_ui": "tui",
    "quiet_start": true,
    "vt100_hint": true,
    "cmd_prefix": "/",
    "cli_prompt": "$(CFG)> ",
    "cli_completion": true,
    "show_traceback": true,
    "cfg_enabled": true,
    "run_enabled": true,
    "proto_enabled": true,
    "record_enabled": true,
    "config_read_only": false,
    "custom_buttons_side": "bottom",
    "custom_buttons": [
        {"enabled": true, "name": "Demo Help", "command": "{prefix}cls\\n{prefix}help", "tooltip": "Show all commands (termapy + device)"},
        {"enabled": true, "name": "AT Demo", "command": "{prefix}cls\\n{prefix}run at_demo.run", "tooltip": "Run all AT commands with delays"},
        {"enabled": true, "name": "Info", "command": "{prefix}cfg.info", "tooltip": "Project info"},
        {"enabled": true, "name": "Probe", "command": "{prefix}probe", "tooltip": "Demo plugin: query the device"},
        {"enabled": true, "name": "TempPlot", "command": "{prefix}temp_plot 30", "tooltip": "Demo plugin: temperature sparkline"}
    ]
}
