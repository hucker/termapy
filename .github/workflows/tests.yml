name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Run tests with coverage
        run: uv run --python 3.14 pytest --cov=termapy --cov-report=xml:coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: hucker/termapy

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync
      - name: Run pip-audit
        run: uvx pip-audit --strict --skip-editable --path .

  io-channel-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid ctx.io._write and ctx.io._write_markup in builtins
        run: |
          if grep -rE 'ctx\.io\._write(_markup)?\b' src/termapy/builtins/; then
            echo
            echo "ERROR: handler code in src/termapy/builtins/ must not call ctx.io._write or ctx.io._write_markup directly."
            echo "Use the semantic channels instead: result / output / status (or the _markup variants)."
            echo "The underscore-prefixed primitives are reserved for engine-internal use."
            exit 1
          fi
          echo "OK: no _write/_write_markup callers in builtins."
