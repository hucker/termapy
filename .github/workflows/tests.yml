name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Run tests
        # CRC code-gen execution tests (which needed gcc/rustc/ghdl on
        # PATH) moved out to the standalone crcglot package in 2026-05;
        # they run in crcglot's own CI now.  Termapy keeps a tiny
        # wrapper smoke test that doesn't need any toolchain.
        #
        # --extra mcp installs the MCP SDK so the ~180 tests guarded by
        # pytest.importorskip("mcp") actually run.  Without it they are
        # silently uncollected and the MCP server (mcp/server.py etc.) has
        # zero CI coverage.  The `web` extra gates no tests, so it is not
        # needed here.
        run: uv run --python ${{ matrix.python-version }} --extra mcp pytest

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Run tests with coverage
        # --extra mcp so the MCP tests run and mcp/* is counted in coverage
        # (previously 0% in CI because those tests were uncollected).
        run: uv run --python 3.14 --extra mcp pytest --cov=termapy --cov-report=xml:coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: hucker/termapy

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync
      - name: Run pip-audit
        run: uvx pip-audit --strict --skip-editable --path .

  io-channel-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid ctx.io._write and ctx.io._write_markup in builtins
        run: |
          if grep -rE 'ctx\.io\._write(_markup)?\b' src/termapy/builtins/; then
            echo
            echo "ERROR: handler code in src/termapy/builtins/ must not call ctx.io._write or ctx.io._write_markup directly."
            echo "Use the semantic channels instead: result / output / status (or the _markup variants)."
            echo "The underscore-prefixed primitives are reserved for engine-internal use."
            exit 1
          fi
          echo "OK: no _write/_write_markup callers in builtins."
